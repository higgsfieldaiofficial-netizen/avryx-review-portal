<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avryx Studio — Secure Video Review</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#eee; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; padding:18px 24px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #1c1c1c; position:sticky; top:0; background:#0a0a0a; z-index:10; }
  .logo { width:34px; height:34px; background:#ff2222; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#000; font-size:20px; }
  .brand { font-weight:800; letter-spacing:2px; font-size:15px; }
  .brand span { color:#ff2222; }
  main { width:100%; max-width:960px; padding:24px 20px; flex:1; }
  .card { background:#141414; border:1px solid #222; border-radius:14px; padding:28px; text-align:center; margin-bottom:20px; }
  .card h1 { font-size:22px; margin-bottom:10px; }
  .card p { color:#999; font-size:14px; line-height:1.6; }
  .error { border-color:#5a1a1a; }
  .error h1 { color:#ff5555; }
  .clip { background:#141414; border:1px solid #222; border-radius:14px; padding:20px; margin-bottom:20px; }
  .cliphead { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
  .cliphead h2 { font-size:17px; }
  .videowrap { position:relative; width:100%; border-radius:12px; overflow:hidden; background:#000; border:1px solid #222; }
  video { width:100%; display:block; max-height:70vh; }
  .watermark { position:absolute; pointer-events:none; color:rgba(255,255,255,.55); font-size:15px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.8); white-space:nowrap; transition:top 1s ease,left 1s ease; z-index:5; }
  .ccontrols { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:10px; padding:10px 12px; background:linear-gradient(transparent, rgba(0,0,0,.7)); z-index:6; }
  .ccontrols button { background:rgba(255,255,255,.16); border:0; color:#fff; width:36px; height:36px; border-radius:50%; font-size:15px; cursor:pointer; flex:0 0 auto; }
  .ccontrols button:active { background:rgba(255,255,255,.3); }
  .cc-track { flex:1; height:6px; background:rgba(255,255,255,.25); border-radius:3px; cursor:pointer; }
  .cc-fill { height:100%; width:0; background:#ff2222; border-radius:3px; }
  .cc-time { color:#fff; font-size:11px; white-space:nowrap; }
  .videowrap:fullscreen { border-radius:0; border:0; }
  .videowrap:fullscreen video { max-height:none; height:100%; }
  .videowrap:fullscreen .watermark { font-size:22px; color:rgba(255,255,255,.75); background:rgba(0,0,0,.35); padding:6px 14px; border-radius:8px; }
  .videowrap:fullscreen .ccontrols { padding:14px 18px; }
  .meta { margin-top:16px; color:#888; font-size:13px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .badge { display:inline-block; background:#12300f; color:#7ee787; border:1px solid #1d4d16; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; }
  .count { color:#888; font-size:13px; }
  footer { padding:20px; color:#555; font-size:12px; text-align:center; }
  .note { margin-top:14px; font-size:12px; color:#666; }
</style>
</head>
<body oncontextmenu="return false">
<header>
  <div class="logo">A</div>
  <div class="brand">AVRYX <span>STUDIO</span></div>
</header>
<main>
  <div id="app"><div class="card"><h1>Loading…</h1></div></div>
</main>
<footer>© Avryx Studio — Private review link. Do not share or redistribute.</footer>

<script>
(function(){
  "use strict";
  var SECRET = "avx_rev_2026_x7q2";

  function cyrb53(str, seed){
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i=0;i<str.length;i++){
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
    h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
    return (h2>>>0).toString(16) + (h1>>>0).toString(16);
  }
  function b64urlDecode(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/');
    while (s.length % 4) s += '=';
    return decodeURIComponent(escape(atob(s)));
  }
  function verifyToken(tok){
    try {
      var parts = tok.split('.');
      if (parts.length !== 2) return null;
      if (cyrb53(parts[0] + SECRET, 7) !== parts[1]) return null;
      var data = JSON.parse(b64urlDecode(parts[0]));
      if (Date.now() > data.e * 1000) return { expired:true };
      // normalize: single video -> playlist of 1
      if (data.v && !data.pl) data.pl = [{ t: data.title || 'Video Review', v: data.v }];
      if (!data.pl || !data.pl.length) return null;
      return { ok:true, data:data };
    } catch(e){ return null; }
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var app = document.getElementById('app');
  var qs = new URLSearchParams(location.search);
  var tok = qs.get('t');
  var pid = qs.get('p');

  function startWithToken(t){
    var res = verifyToken(t);
    if (!res){
      app.innerHTML = '<div class="card error"><h1>⛔ Invalid Link</h1><p>This review link is not valid.<br>Please check the link or contact Avryx Studio.</p></div>';
      return;
    }
    if (res.expired){
      app.innerHTML = '<div class="card error"><h1>⌛ Link Expired</h1><p>This review link has expired.<br>Please ask Avryx Studio for a fresh link.</p></div>';
      return;
    }
    boot(res.data);
  }

  if (tok){
    startWithToken(tok);
  } else if (pid){
    var clean = String(pid).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40);
    if (!clean){
      app.innerHTML = '<div class="card error"><h1>⛔ Invalid Link</h1></div>';
      return;
    }
    fetch('p/' + clean + '.json', {cache:'no-store'})
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(j){
        if (!j.d || cyrb53(j.d + SECRET, 7) !== j.s) throw 0;
        var data = JSON.parse(b64urlDecode(j.d));
        if (Date.now() > data.e * 1000){
          app.innerHTML = '<div class="card error"><h1>⌛ Link Expired</h1><p>This review link has expired.<br>Please ask Avryx Studio for a fresh link.</p></div>';
          return;
        }
        boot(data);
      })
      .catch(function(){
        app.innerHTML = '<div class="card error"><h1>⛔ Invalid Link</h1><p>This review link is not valid.<br>Please check the link or contact Avryx Studio.</p></div>';
      });
  } else {
    app.innerHTML = '<div class="card"><h1>🔒 Private Review Link</h1><p>This page needs a secure review link.<br>Please open the exact link shared with you by Avryx Studio.</p></div>';
    return;
  }

  function boot(d){
  var clientName = d.n || 'Guest';

  // ---- access code gate (session persists on this device until link expiry) ----
  function getSession(){
    try { return JSON.parse(localStorage.getItem('avx_session')||'null'); }
    catch(e){ return null; }
  }
  function saveSession(nonce){
    try { localStorage.setItem('avx_session', JSON.stringify({nonce:nonce, t:Date.now()})); }
    catch(e){}
  }
  function showCodeGate(msg){
    app.innerHTML = '<div class="card" style="max-width:420px;margin:40px auto">' +
      '<h1>🔑 Enter Access Code</h1>' +
      '<p>Enter the 6-digit access code shared with you by Avryx Studio.</p>' +
      '<input type="text" id="codeIn" inputmode="numeric" maxlength="6" placeholder="••••••" style="text-align:center;font-size:24px;letter-spacing:8px;font-weight:800">' +
      '<br><button id="codeBtn">Unlock Videos</button>' +
      (msg ? '<p id="codeMsg" style="color:#ff5555;font-size:13px;margin-top:12px">'+esc(msg)+'</p>' : '<p id="codeMsg" style="font-size:13px;margin-top:12px"></p>') +
      '</div>';
    var inp = document.getElementById('codeIn');
    inp.focus();
    function tryUnlock(){
      var val = inp.value.replace(/\D/g,'');
      if (val === String(d.code)){
        saveSession(d.nonce);
        renderGallery();
      } else {
        document.getElementById('codeMsg').textContent = 'Wrong code. Try again.';
        document.getElementById('codeMsg').style.color = '#ff5555';
        inp.select();
      }
    }
    document.getElementById('codeBtn').onclick = tryUnlock;
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryUnlock(); });
  }

  function renderGallery(){
    var expStr = new Date(d.e * 1000).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    var html = '<div class="card" style="text-align:left;padding:20px 24px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h1 style="font-size:19px;margin:0">🎬 Video Review</h1><span class="badge">● Secure preview</span></div>' +
      '<div class="meta"><span>👤 ' + esc(clientName) + '</span><span class="count">' + d.pl.length + ' clip' + (d.pl.length>1?'s':'') + '</span><span>⏳ Valid till ' + esc(expStr) + '</span></div></div>';

    d.pl.forEach(function(clip, i){
      html += '<div class="clip"><div class="cliphead"><h2>🎬 ' + esc(clip.t || ('Clip ' + (i+1))) + '</h2></div>' +
        '<div class="videowrap"><video playsinline disablepictureinpicture preload="metadata" data-src="' + esc(clip.v) + '"></video><div class="watermark"></div>' +
        '<div class="ccontrols"><button class="cc-play" aria-label="Play">▶</button><div class="cc-track"><div class="cc-fill"></div></div><span class="cc-time">0:00 / 0:00</span><button class="cc-mute" aria-label="Mute">🔊</button><button class="cc-fs" aria-label="Fullscreen">⛶</button></div></div></div>';
    });
    html += '<p class="note" style="text-align:center">These videos are watermarked and tracked. Downloading, screen recording or redistribution is prohibited.</p>';
    app.innerHTML = html;

    var vids = Array.prototype.slice.call(document.querySelectorAll('video[data-src]'));
    function loadVid(v){ if (!v.src){ v.src = v.getAttribute('data-src'); v.load(); } }
    if ('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(es){
        es.forEach(function(en){ if (en.isIntersecting){ loadVid(en.target); io.unobserve(en.target); } });
      }, {rootMargin:'300px'});
      vids.forEach(function(v){ io.observe(v); });
    } else { vids.forEach(loadVid); }

    function moveWm(wrap){
      var wm = wrap.querySelector('.watermark');
      var ts = new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
      wm.textContent = '© ' + clientName + '  •  ' + ts;
      var maxX = Math.max(0, wrap.clientWidth - wm.offsetWidth - 16);
      var maxY = Math.max(0, wrap.clientHeight - 40);
      wm.style.left = (8 + Math.random()*maxX) + 'px';
      wm.style.top = (8 + Math.random()*maxY) + 'px';
    }
    var wraps = Array.prototype.slice.call(document.querySelectorAll('.videowrap'));
    function fmtT(s){ s=Math.max(0,Math.floor(s||0)); var m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
    wraps.forEach(function(w){
      var v = w.querySelector('video');
      var playBtn = w.querySelector('.cc-play');
      var muteBtn = w.querySelector('.cc-mute');
      var fsBtn = w.querySelector('.cc-fs');
      var track = w.querySelector('.cc-track');
      var fill = w.querySelector('.cc-fill');
      var timeEl = w.querySelector('.cc-time');
      function updPlay(){ playBtn.textContent = v.paused ? '▶' : '⏸'; }
      function toggle(){ if (v.paused){ v.play(); } else { v.pause(); } updPlay(); }
      playBtn.onclick = toggle;
      v.addEventListener('click', toggle);
      v.addEventListener('play', updPlay);
      v.addEventListener('pause', updPlay);
      v.addEventListener('loadedmetadata', function(){ timeEl.textContent = '0:00 / ' + fmtT(v.duration); });
      v.addEventListener('timeupdate', function(){
        if (v.duration) fill.style.width = (v.currentTime/v.duration*100) + '%';
        timeEl.textContent = fmtT(v.currentTime) + ' / ' + fmtT(v.duration);
      });
      track.addEventListener('click', function(e){
        var r = track.getBoundingClientRect();
        var p = (e.clientX - r.left)/r.width;
        if (v.duration) v.currentTime = Math.max(0, Math.min(1, p)) * v.duration;
      });
      muteBtn.onclick = function(){ v.muted = !v.muted; muteBtn.textContent = v.muted ? '🔇' : '🔊'; };
      fsBtn.onclick = function(){
        if (document.fullscreenElement){ document.exitFullscreen(); }
        else if (w.requestFullscreen){ w.requestFullscreen(); }
        else if (v.webkitEnterFullscreen){ v.webkitEnterFullscreen(); }
      };
      moveWm(w);
      setInterval(function(){ moveWm(w); }, 4000);
    });

    document.addEventListener('dragstart', function(e){ e.preventDefault(); });
    document.addEventListener('keydown', function(e){
      if (e.key === 'F12') e.preventDefault();
      if ((e.ctrlKey||e.metaKey) && ['s','p','u','c'].indexOf(e.key.toLowerCase()) !== -1) e.preventDefault();
      if ((e.ctrlKey||e.metaKey) && e.shiftKey && ['i','j'].indexOf(e.key.toLowerCase()) !== -1) e.preventDefault();
    });
    document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

  // entry: code gate if the link carries a code, else direct gallery.
  // Once unlocked, the session persists on this device — refresh won't ask for the code again — until the link expires.
  if (d.code){
    var s = getSession();
    if (s && s.nonce === d.nonce){
      renderGallery();
    } else {
      showCodeGate('');
    }
  } else {
    renderGallery();
  }
  } // end boot
})();
</script>
</body>
</html>
